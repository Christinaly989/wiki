services:
  - type: web
    name: macro-regime-dashboard
    env: node
    plan: free
    buildCommand: node scripts/restore-source.mjs && npm install && npm --prefix client install && npm run build
    startCommand: node scripts/restore-source.mjs && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: APP_TIMEZONE
        value: Asia/Shanghai
      - key: POLL_INTERVAL_MINUTES
        value: 0
