name: Render Free Refresh

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore bundled source
        run: node scripts/restore-source.mjs

      - name: Install dependencies
        run: |
          npm install
          npm --prefix client install

      - name: Refresh dashboard cache
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_VERSION: ${{ secrets.NOTION_VERSION }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_REASONING_EFFORT: ${{ secrets.DEEPSEEK_REASONING_EFFORT }}
          DEEPSEEK_TIMEOUT_MS: ${{ secrets.DEEPSEEK_TIMEOUT_MS }}
          APP_TIMEZONE: Asia/Shanghai
          POLL_INTERVAL_MINUTES: 0
        run: npm run refresh:cache

      - name: Rebuild bundled source
        run: node scripts/build-source-bundles.mjs

      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/render-cache.json source-bundle/server-source.b64 source-bundle/server-source.json
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh render cache"
          git push
